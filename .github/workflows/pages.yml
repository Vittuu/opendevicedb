name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # expired claims drop off, request 👍 counts refresh
  issues:
    types: [opened, closed, reopened, edited, deleted] # device requests (wanted.json), install reports (install-reports.json)
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false # a newer run waits; pending ones in between are dropped
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run validate
      - run: npm run build -w site
        env:
          GITHUB_TOKEN: ${{ github.token }} # device requests and install reports are read from the issues API (issues: read)
      - uses: actions/configure-pages@v5
      # Same as actions/upload-pages-artifact, minus its dotfile exclusion: the site serves
      # /.well-known/mcp-registry-auth (MCP Registry domain verification).
      - name: Package site
        run: tar --dereference --hard-dereference --directory site/dist -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github . > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
