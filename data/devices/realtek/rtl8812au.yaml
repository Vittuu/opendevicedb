summary: Older Realtek 802.11ac dual-band USB Wi-Fi chip (AC1200), in many USB 3.0 dongles from TP-Link,
  D-Link, ASUS, Netgear, Edimax, Belkin, TRENDnet and others. Driven by the mainline Linux rtw88 driver
  since Linux 6.13 (automatic detection of all USB ids from 6.14); the chip loads a Realtek firmware file
  shipped in linux-firmware.
interfaces:
- name: Wi-Fi (802.11ac) over USB
  transport: usb
  status: documented
  confidence: high
  notes: Linux driver rtw88_8812au (mainline since 6.13); firmware rtw88/rtw8812a_fw.bin. Find your adapter's
    id with lsusb.
install:
- project: Linux rtw88 driver
  method: host-software
  guide: https://github.com/morrownr/USB-WiFi/blob/main/home/USB_WiFi_Chipsets.md
