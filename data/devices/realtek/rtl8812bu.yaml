summary: Realtek's common 802.11ac dual-band USB Wi-Fi chip, found in many "AC1200 / 1200M" USB 3.0 dongles
  (TP-Link Archer T3U/T4U, ASUS USB-AC55/AC58, D-Link DWA-181/182/183, Edimax, Netgear A6150, Mercusys
  MA30H…). The RTL8822BU variant adds Bluetooth. Driven by the mainline Linux rtw88 driver since Linux
  6.2 (6.12 or later recommended); the chip loads a Realtek firmware file shipped in linux-firmware.
interfaces:
- name: Wi-Fi (802.11ac) over USB
  transport: usb
  status: documented
  confidence: high
  notes: Linux driver rtw88_8822bu (mainline since 6.2); firmware rtw88/rtw8822b_fw.bin. Find your adapter's
    id with lsusb.
install:
- project: Linux rtw88 driver
  method: host-software
  guide: https://github.com/morrownr/USB-WiFi/blob/main/home/USB_WiFi_Chipsets.md
  difficulty: easy
  tools:
  - Linux 6.2 or later with linux-firmware
  opens_device: false
  mains_powered: false
  brick_risk: none
  reversible: 'yes'
  notes: 'Plug it in: a recent kernel loads the driver by itself. Older kernels can use the out-of-tree
    morrownr driver.'
