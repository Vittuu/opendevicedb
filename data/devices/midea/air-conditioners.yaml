    url: https://github.com/wuwentao/midea_ac_lan
    kind: integration
    license: MIT
  - name: msmart-ng
    url: https://github.com/mill1000/midea-msmart
    kind: library
    license: MIT
provenance:
  sources: [curated, https://github.com/wuwentao/midea_ac_lan]
  ai_assisted: true
  tools: [claude-code]
